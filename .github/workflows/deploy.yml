name: Build and Deploy Bookshelf

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'covers/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  schedule:
    # Daily at 00:00 UTC = 09:00 KST
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Sync from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: 4453bde340384a27a120ad5a882a847c
        run: node scripts/sync-from-notion.mjs

      - name: Scrape new covers
        run: node scripts/scrape-covers.mjs

      - name: Scrape yes24 (목차·평점·ISBN)
        run: node scripts/scrape-yes24.mjs

      - name: Enrich book info (국립중앙도서관 seoji)
        env:
          SEOJI_API_KEY: ${{ secrets.SEOJI_API_KEY }}
        run: |
          if [ -n "$SEOJI_API_KEY" ]; then
            node scripts/enrich-seoji.mjs
          else
            echo "SEOJI_API_KEY 미설정 — 책소개 수집 건너뜀"
          fi

      - name: Generate insights (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            node scripts/generate-insights.mjs
          else
            echo "GEMINI_API_KEY 미설정 — 인사이트 생성 건너뜀"
          fi

      - name: Commit sync changes (if any)
        run: |
          if [[ -n "$(git status --porcelain data/books.csv data/seoji.json data/yes24.json data/insights.json covers/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/books.csv data/seoji.json data/yes24.json data/insights.json covers/
            git commit -m "sync: 노션 DB 자동 업데이트"
            git push
          else
            echo "변경 사항 없음."
          fi

      - name: Build site
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
